upstream puma {
    server unix:///rails/tmp/sockets/puma.sock fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    root /rails/public;
    access_log /var/log/nginx/kazhutha_access.log;
    error_log  /var/log/nginx/kazhutha_error.log;

    client_max_body_size 10M;
    keepalive_timeout    65;

    # -------------------------------------------------------
    # WebSocket upgrade — critical for ActionCable
    # -------------------------------------------------------
    location /cable {
        proxy_pass         http://puma;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # 24h for long-lived WS connections
        proxy_send_timeout 86400;
    }

    # -------------------------------------------------------
    # REST API
    # -------------------------------------------------------
    location /api {
        proxy_pass         http://puma;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }

    # -------------------------------------------------------
    # Sidekiq Web UI (restrict access)
    # -------------------------------------------------------
    location /sidekiq {
        proxy_pass         http://puma;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Add IP whitelist or HTTP Basic Auth here for production
    }

    # Health check
    location /up {
        proxy_pass http://puma;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;
}
