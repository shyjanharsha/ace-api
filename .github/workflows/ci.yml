name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: RSpec Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       kazhutha_kali_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      RAILS_ENV:          test
      DATABASE_URL:       postgresql://postgres:postgres@localhost/kazhutha_kali_test
      REDIS_URL:          redis://localhost:6379/0
      REDIS_CABLE_URL:    redis://localhost:6379/2
      JWT_SECRET_KEY:     test_jwt_secret_key_at_least_64_chars_long_for_testing_only
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_at_least_64_chars_for_testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.8"
          bundler-cache: true

      - name: Setup DB
        run: bundle exec rails db:create db:migrate

      - name: Run RSpec
        run: bundle exec rspec --format progress

      - name: Run Rubocop
        run: bundle exec rubocop --format github

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --target build -t kazhutha-kali-api:test .

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/kazhutha-kali-api:$IMAGE_TAG .
          docker push $ECR_REGISTRY/kazhutha-kali-api:$IMAGE_TAG

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster kazhutha-kali \
            --service kazhutha-kali-api \
            --force-new-deployment
